name: Build KemetOS 1.0 Real Debian ISO (Free Runner)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'ISO profile (lite = fast low-RAM ISO, full = includes Chromium & Wine)'
        required: true
        default: 'lite'
        type: choice
        options:
          - lite
          - full

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout KemetOS Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri & Debian ISO Builder Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Build KemetOS Frontend & Rust Tauri (.deb)
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build
          npx --yes @tauri-apps/cli@^2 build --bundles deb

      - name: Build Bootable Debian 12 KemetOS ISO
        env:
          KEMETOS_ISO_PROFILE: ${{ inputs.profile }}
        run: |
          chmod +x iso-builder/build-iso.sh iso-builder/nizamos-install.sh
          sudo -E ./iso-builder/build-iso.sh

      - name: Upload KemetOS .deb Installer
        uses: actions/upload-artifact@v4
        with:
          name: kemetos-desktop-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14

      - name: Upload Bootable KemetOS 1.0 ISO
        uses: actions/upload-artifact@v4
        with:
          name: kemetos-1.0-amd64-iso-${{ inputs.profile }}
          path: KemetOS-1.0-amd64.iso
          retention-days: 14
